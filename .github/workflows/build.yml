name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch Nothing Glyph SDK
        run: ./tools/fetch-glyph-sdk.sh

      - name: Core unit tests (plan parser, validator, triggers, engine)
        run: ./gradlew -p core test --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Lint
        run: |
          ./gradlew :app:lintDebug --console=plain
          cat app/build/reports/lint-results-debug.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vigil-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # A rolling pre-release so the APK can be downloaded straight from a phone browser. It is built from main
      # only (other branches just build, test and attach the APK to their run), and only the newest commit of main
      # publishes, so an older run finishing late never replaces it.
      - name: Publish "latest" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then echo "Not the branch head; not publishing."; exit 0; fi
          cp app/build/outputs/apk/debug/app-debug.apk vigil.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest vigil.apk --prerelease --target "$GITHUB_SHA" \
            --title "VIGIL latest build" \
            --notes "Built from main at ${GITHUB_SHA}. Download vigil.apk on your phone and open it to install (allow installs from your browser when asked)."
